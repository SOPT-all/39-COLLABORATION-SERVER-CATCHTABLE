spring:
  application:
    name: catchtable

  # 로컬: 비워두면 compose.yaml의 MySQL에 자동 연결 (Docker 필요)
  # CI·배포: 환경변수로 DB 접속 정보 주입
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      # 로컬·CI는 update로 테이블 자동 생성
      # 운영은 첫 배포로 테이블 생성 후 반드시 JPA_DDL_AUTO=validate 로 설정
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}

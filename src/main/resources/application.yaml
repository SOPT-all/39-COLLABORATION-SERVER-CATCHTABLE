spring:
  application:
    name: catchtable

  # 로컬은 비워두면 compose.yaml의 MySQL에 자동 연결
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      # 운영은 테이블 생성 후 JPA_DDL_AUTO=validate 필수
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}

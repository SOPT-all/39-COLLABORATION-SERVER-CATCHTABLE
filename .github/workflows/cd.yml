name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 배포가 겹치지 않도록 하나씩 실행 (진행 중인 배포는 취소하지 않음)
concurrency:
  group: cd
  cancel-in-progress: false

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/catchtable-server

jobs:
  build-push:
    # 수동 실행(workflow_dispatch) 시에도 main 브랜치만 배포
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        # SSH 키를 받는 외부 액션이라 태그 대신 커밋 SHA로 고정
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # 접속 대상이 실제 EC2인지 호스트 키 지문으로 확인 (중간자 공격 방지)
          fingerprint: ${{ secrets.EC2_SSH_FINGERPRINT }}
          envs: IMAGE
          script: |
            set -e

            run_container() {
              docker rm -f catchtable > /dev/null 2>&1 || true
              docker run -d --name catchtable \
                -p 8080:8080 \
                --env-file ~/catchtable.env \
                --restart unless-stopped \
                "$1"
            }

            # 최대 60초 동안 응답을 기다린다
            wait_healthy() {
              for i in $(seq 1 30); do
                if curl -sf http://localhost:8080/v3/api-docs > /dev/null; then
                  return 0
                fi
                sleep 2
              done
              return 1
            }

            docker pull "$IMAGE"

            # 롤백 대상: 현재 실행 중인 컨테이너의 이미지 (첫 배포면 없음)
            PREV_IMAGE=$(docker inspect --format '{{.Config.Image}}' catchtable 2>/dev/null || true)

            run_container "$IMAGE"

            if wait_healthy; then
              echo "Health check passed: $IMAGE"
              # 실행 중인 컨테이너가 쓰지 않는 이미지 전부 삭제 (이전 배포 이미지 포함)
              docker image prune -af
              exit 0
            fi

            echo "Health check failed: $IMAGE"
            docker logs --tail 100 catchtable

            if [ -n "$PREV_IMAGE" ] && [ "$PREV_IMAGE" != "$IMAGE" ]; then
              echo "Rolling back to $PREV_IMAGE"
              run_container "$PREV_IMAGE"
              if wait_healthy; then
                echo "Rollback succeeded: $PREV_IMAGE"
              else
                echo "Rollback failed: $PREV_IMAGE"
                docker logs --tail 100 catchtable
              fi
            else
              echo "No previous image to roll back to"
            fi

            # 롤백에 성공해도 새 버전 배포는 실패했으므로 CD는 실패 처리
            exit 1

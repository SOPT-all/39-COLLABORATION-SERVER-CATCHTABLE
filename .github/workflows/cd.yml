name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 배포가 겹치지 않도록 하나씩 실행 (진행 중인 배포는 취소하지 않음)
concurrency:
  group: cd
  cancel-in-progress: false

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/catchtable-server

jobs:
  build-push:
    # 수동 실행(workflow_dispatch) 시에도 main 브랜치만 배포
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        # SSH 키를 받는 외부 액션이라 태그 대신 커밋 SHA로 고정
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # 접속 대상이 실제 EC2인지 호스트 키 지문으로 확인 (중간자 공격 방지)
          fingerprint: ${{ secrets.EC2_SSH_FINGERPRINT }}
          envs: IMAGE
          script: |
            set -e
            docker pull "$IMAGE"
            docker rm -f catchtable || true
            docker run -d --name catchtable \
              -p 8080:8080 \
              --env-file ~/catchtable.env \
              --restart unless-stopped \
              "$IMAGE"

            # 헬스체크: 최대 60초 동안 응답을 기다리고, 없으면 배포 실패 처리
            for i in $(seq 1 30); do
              if curl -sf http://localhost:8080/v3/api-docs > /dev/null; then
                echo "Health check passed"
                # 실행 중인 컨테이너가 쓰지 않는 이미지 전부 삭제 (이전 배포 이미지 포함)
                docker image prune -af
                exit 0
              fi
              sleep 2
            done

            echo "Health check failed"
            docker logs --tail 100 catchtable
            exit 1

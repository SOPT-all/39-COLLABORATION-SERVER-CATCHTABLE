name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    # 테스트용 DB 접속 정보 (테스트 후 버려지는 컨테이너라 비밀값 아님)
    env:
      DB_URL: jdbc:mysql://localhost:3306/catchtable
      DB_USERNAME: root
      DB_PASSWORD: root

    # 테스트(contextLoads)가 DB 연결을 필요로 해서 MySQL을 함께 띄운다
    # services에서는 env 컨텍스트를 쓸 수 없어 값을 직접 적는다 → 위 DB_PASSWORD와 맞출 것
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: catchtable
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        # mysqladmin ping은 서버가 떠 있으면 인증 없이도 성공하므로 비밀번호를 넘기지 않는다
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build and test
        run: ./gradlew build --no-daemon

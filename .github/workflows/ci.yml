name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    # 테스트(contextLoads)가 DB 연결을 필요로 해서 MySQL을 함께 띄운다
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: catchtable
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build and test
        run: ./gradlew build --no-daemon
        env:
          DB_URL: jdbc:mysql://localhost:3306/catchtable
          DB_USERNAME: root
          DB_PASSWORD: root
